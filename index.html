<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Quản Lý Kho Vật Tư Dự Phòng Đội Thông Tin</title>
    <meta name="description" content="Hệ thống quản lý vật tư dự phòng tại chỗ, kiểm kê định danh QR Code và lập biên bản bàn giao thiết bị kỹ thuật hàng không Đội Thông Tin." />
    
    <!-- Mobile App & PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QL Kho Vật Tư Đội TT" />
    <meta name="application-name" content="Quản Lý Kho Vật Tư Dự Phòng Đội Thông Tin" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#2563EB" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Dark Mode Immediate Hydration Script -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('cns_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#2563EB');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts for Vietnamese Typography & Monospace Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Open Graph & Social -->
    <meta property="og:title" content="Quản Lý Kho Vật Tư Dự Phòng Đội Thông Tin" />
    <meta property="og:description" content="Hệ thống quản lý vật tư dự phòng tại chỗ, kiểm kê định danh QR Code và lập biên bản bàn giao thiết bị kỹ thuật hàng không Đội Thông Tin." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-100 dark:bg-[#0f172a] text-slate-900 dark:text-slate-100 select-none sm:select-auto antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
